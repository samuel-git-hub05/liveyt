[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liveyt-sermon-dubber"
version = "1.0.0"
description = "Live and local Telugu sermon dubbing into Hindi and English"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LiveYT contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "websockets>=12,<14",
]

[project.optional-dependencies]
live = [
  "torch>=2.2",
  "yt-dlp>=2024.4.9",
  "silero-vad>=5.1.2",
  "sounddevice>=0.4.6",
  "PyAudio>=0.2.14",
  "edge-tts>=6.1.12",
]
local-video = [
  "torch>=2.2",
  "faster-whisper>=1.1.0",
  "ctranslate2>=4.4.0",
  "transformers>=4.44.0",
  "sentencepiece>=0.2.0",
  "accelerate>=0.34.0",
  "edge-tts>=6.1.12",
]
test = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
liveyt = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["liveyt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
